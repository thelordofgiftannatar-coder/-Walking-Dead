name: Build Prime One Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prime One
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Capacitor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --legacy-peer-deps; fi
          npm run build

      - name: Install Capacitor & scaffold Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          rm -rf android
          npx cap add android
          node android-config/apply-android-config.mjs
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Prime One APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-one-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
